name: TASK
description: 기타 작업
labels: ["task"]
body:
  - type: dropdown
    id: application
    attributes:
      label: 애플리케이션
      options:
        - xquare-user-application
        - xquare-admin-application
        - 공유 모듈
        - 전체
        - 인프라
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      placeholder: 어떤 작업을 수행했는지 / 작업 이유
    validations:
      required: true
