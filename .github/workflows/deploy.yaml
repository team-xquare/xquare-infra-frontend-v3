name: Deploy

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "applications/xquare-admin-application/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  APP_DIR: applications/xquare-user-application

jobs:
  build:
    name: Build
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    env:
      BUILD_SCRIPT: ${{ github.ref_name == 'main' && 'build' || 'build:stag' }}
      FRONTEND_URL: ${{ github.ref_name == 'main' && 'https://xquare.dsmhs.kr' || 'https://xquare-stag.dsmhs.kr' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: bun run "$BUILD_SCRIPT"

      - name: Check env
        working-directory: ${{ env.APP_DIR }}/dist
        run: |
          test -f index.html
          if ! grep -rqF "$FRONTEND_URL" assets/; then
            echo "::error::번들에 $FRONTEND_URL 값이 없습니다. env 파일을 확인하세요."
            exit 1
          fi

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ env.APP_DIR }}/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: [self-hosted, xquare-frontend]
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'stag' }}
      url: ${{ github.ref_name == 'main' && 'https://xquare.dsmhs.kr' || 'https://xquare-stag.dsmhs.kr' }}
    env:
      TARGET: ${{ github.ref_name == 'main' && '/var/www/xquare-prod' || '/var/www/xquare-stag' }}
      PORT: ${{ github.ref_name == 'main' && '80' || '8080' }}

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ runner.temp }}/dist

      - name: Replace files
        shell: bash
        run: |
          SRC="$RUNNER_TEMP/dist"
          test -f "$SRC/index.html"
          rsync -a --delete-after --delay-updates --chmod=D755,F644 "$SRC/" "$TARGET/"

      - name: Check nginx
        shell: bash
        run: cmp <(curl -fsS "http://127.0.0.1:$PORT/") "$TARGET/index.html"
